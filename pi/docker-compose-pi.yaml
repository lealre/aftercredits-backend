# Reference compose for the Raspberry Pi deploy (postgres era).
# The live copy lives in the frontend repo as docker-compose-pi.yaml —
# keep the two in sync. The mongo service is intentionally ABSENT here:
# after the cutover the old mongo container stays stopped-but-intact as
# rollback until the cleanup PR (see README.md runbook).

services:
  postgres:
    image: postgres:16
    container_name: aftercredits-postgres
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-aftercredits}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aftercredits}
      - POSTGRES_DB=${POSTGRES_DB:-aftercredits}
    volumes:
      - /mnt/usb_storage/aftercredits_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER:-aftercredits}\" -d \"${POSTGRES_DB:-aftercredits}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  db-setup:
    image: lealre/aftercredits-backend:latest
    container_name: aftercredits-db-setup
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "set -e && echo 'Applying schema migrations...' && /app/database -migrate && echo 'Running superuser setup...' && /app/database -superuser"]
    restart: "no"

  backend:
    image: lealre/aftercredits-backend:latest
    container_name: aftercredits-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    container_name: aftercredits-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"
