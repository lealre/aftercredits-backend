# Scrape configuration for the aftercredits backend.
#
# The target is the backend service's name on the shared compose network, not a
# host port: the metrics listener is never published on the Pi, so this is the
# only route to it.
#
# 10s. The obvious instinct is to scrape slowly on a Pi to spare the SD card,
# and 30s was the first choice for that reason — but it made the dashboard
# unusable: Grafana's $__interval on a short range resolved below the scrape
# interval, increase() saw fewer than two samples, and panels read "No data"
# for the first minute after any traffic.
#
# The write cost is not what the instinct assumes. This target exposes a few
# hundred series; at 10s that is still trivial against the 512 MB retention
# cap, which is the thing that actually bounds disk.
global:
  scrape_interval: 10s
  scrape_timeout: 5s

scrape_configs:
  - job_name: aftercredits-backend
    static_configs:
      # COUPLED TO THE SERVICE NAME, deliberately and unavoidably: Prometheus
      # does not interpolate environment variables into static_configs, so this
      # cannot be a variable the way STACK_NETWORK is.
      #
      # That matters because on the Pi the shared network belongs to the
      # FRONTEND repo's compose, not this one — so this name has to keep
      # matching a service defined in another repository. It does today.
      #
      # If that service is ever renamed, nothing here errors. The target simply
      # goes DOWN, up{job="aftercredits-backend"} reads 0, and every dashboard
      # panel is empty — so check Prometheus's /targets first when the whole
      # dashboard is blank rather than one panel.
      - targets: ['backend:9090']

  # Container-level CPU and memory for every container on this host, including
  # postgres and the observability stack itself. Absent when cadvisor is not
  # running, which is a supported configuration — the target simply goes DOWN
  # and the container panels empty, while everything process-level keeps working.
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
