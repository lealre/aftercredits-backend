apiVersion: 1

providers:
  - name: aftercredits
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    # Dashboards come from the repository. Edits in the UI would be lost on the
    # next restart, so the UI does not offer them.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
